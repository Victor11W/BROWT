project:
  type: book
  output-dir: _book

lang: fr
book:
  title: "BROWT"
  subtitle: "Laboratoire visuel de perception et de décision"
  author: "Victor Woelffel"
  date: "2026-11-23"
  repo-url: https://github.com/Victor11W/BROWT
  search: true
  sidebar:
    logo: assets/logo.png
    style: docked
  chapters:
    - index.qmd
    - part: "Le projet"
      chapters:
        - roadmap.qmd
        - autonomy.qmd
        - methodology.qmd
        - visual-atlas.qmd
    - part: "Expérimenter"
      chapters:
        - getting-started.qmd
        - dataset.qmd
        - dataset-analysis.qmd
        - observations.qmd
        - detection.qmd
        - rl.qmd
    - part: "Construire et conclure"
      chapters:
        - pipeline.qmd
        - progress.qmd
        - decisions.qmd
        - references.qmd

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: custom.css
    page-layout: article
    grid:
      sidebar-width: 240px
      body-width: 1050px
    toc: true
    toc-depth: 3
    toc-title: "Dans cette page"
    number-sections: true
    code-fold: true
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true
    fig-cap-location: bottom
    mermaid:
      theme: neutral
execute:
  enabled: false
