name: Hosted setup
run-name: Prepare BROWT tickets, PR and service checks
on:
  push:
    branches: [codex/research-foundation]
  workflow_dispatch:
    inputs:
      publish_tickets:
        description: Create the initial research tickets without duplicates
        type: boolean
        default: true
      test_telegram:
        description: Send one setup confirmation to the configured Telegram chat
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: browt-hosted-setup
  cancel-in-progress: false
jobs:
  tickets:
    if: github.event_name == 'push' || inputs.publish_tickets
    runs-on: ubuntu-latest
    outputs:
      created_count: ${{ steps.seed.outputs.result }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create missing initial tickets
        id: seed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const seeds = JSON.parse(fs.readFileSync('.github/autonomy/backlog.json', 'utf8'));
            if (!Array.isArray(seeds) || seeds.length > 20) throw new Error('Invalid backlog');
            const {owner, repo} = context.repo;
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const ids = new Set();
            let createdCount = 0;
            for (const seed of seeds) {
              if (!/^[a-z0-9-]+$/.test(seed.id) || ids.has(seed.id) ||
                  typeof seed.title !== 'string' || !seed.title.trim() ||
                  typeof seed.body !== 'string') throw new Error('Invalid ticket');
              ids.add(seed.id);
              const marker = '<!-- browt-seed:' + seed.id + ' -->';
              const existing = all.find(issue => !issue.pull_request &&
                ((issue.body || '').includes(marker) || issue.title === seed.title));
              if (existing) {
                core.notice('Ticket already exists: #' + existing.number);
                await core.summary.addLink(seed.title, existing.html_url).addEOL().write();
                continue;
              }
              const {data: created} = await github.rest.issues.create({
                owner, repo, title: seed.title, body: seed.body + '\n\n' + marker
              });
              all.push(created);
              createdCount++;
              core.notice('Created ticket #' + created.number);
              await core.summary.addLink(seed.title, created.html_url).addEOL().write();
            }
            return createdCount;
  pull_request:
    if: github.ref_name == 'codex/research-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open the foundation draft PR if needed
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = 'codex/research-foundation';
            const base = context.payload.repository.default_branch;
            if (base === branch) return;
            const {data: existing} = await github.rest.pulls.list({
              owner, repo, state: 'open', head: owner + ':' + branch, base
            });
            if (existing.length) {
              await core.summary.addLink('Existing foundation PR', existing[0].html_url).write();
              return;
            }
            const {data: comparison} = await github.request(
              'GET /repos/{owner}/{repo}/compare/{basehead}',
              {owner, repo, basehead: base + '...' + branch}
            );
            if (!comparison.ahead_by) {
              core.notice('The foundation branch is already integrated.');
              return;
            }
            const body = [
              'BROWT dispose d’un socle CPU pour importer et auditer un dataset YOLO versionné, relire les observations et produire des analyses et figures traçables.',
              'Le livre Quarto est restructuré. Les données brutes et les poids restent hors Git ; les figures sur données réelles et la démonstration synthétique sont distinguées. Aucun entraînement YOLO ou RL réel n’est annoncé.',
              'Le workflow d’amorçage crée les premiers tickets, contrôle l’accès de lecture OpenAI et teste Telegram. Le worker Codex planifié reste à installer.',
              'Validation : consulter Research checks pour la révision courante. La PR reste en brouillon jusqu’à validation du rendu du livre et examen des résultats.'
            ].join('\n\n');
            const {data: pr} = await github.rest.pulls.create({
              owner, repo, head: branch, base, draft: true,
              title: 'Construire le socle de recherche reproductible de BROWT', body
            });
            await core.summary.addLink('Foundation draft PR', pr.html_url).write();
  openai_auth:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check OpenAI model listing without generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: python
        run: |
          import http.client
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get("OPENAI_API_KEY", "").strip()
          if not key or any(ord(char) < 33 or ord(char) == 127 for char in key):
              raise SystemExit("Configure a valid OPENAI_API_KEY repository secret.")
          request = urllib.request.Request(
              "https://api.openai.com/v1/models",
              headers={"Authorization": "Bearer " + key},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit("OpenAI rejected model listing (HTTP " + str(error.code) + ").") from None
          except (OSError, ValueError, http.client.HTTPException):
              raise SystemExit("OpenAI is unreachable or returned an invalid response.") from None
          if not isinstance(result, dict) or not isinstance(result.get("data"), list):
              raise SystemExit("OpenAI returned an unexpected model listing.")
          print("OpenAI model listing succeeded. No generation was requested.")
          print("This does not validate Codex inference, available credits or a spending limit.")
  telegram:
    needs: tickets
    if: ${{ !cancelled() && (inputs.test_telegram || (github.event_name == 'push' && needs.tickets.result == 'success' && needs.tickets.outputs.created_count != '0')) }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send the setup confirmation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: python
        run: |
          import http.client
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not re.fullmatch(r"[0-9]+:[A-Za-z0-9_-]+", token) or not re.fullmatch(r"-?[0-9]+", chat_id):
              raise SystemExit("Configure valid TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets.")
          payload = json.dumps({
              "chat_id": chat_id,
              "text": "BROWT · Telegram connecté ✅\nLes notifications sont prêtes ; le worker Codex reste à configurer.",
              "link_preview_options": {"is_disabled": True},
          }).encode()
          try:
              request = urllib.request.Request(
                  "https://api.telegram.org/bot" + token + "/sendMessage",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit("Telegram rejected the request (HTTP " + str(error.code) + ").") from None
          except (OSError, ValueError, http.client.HTTPException):
              raise SystemExit("Telegram is unreachable or returned an invalid response.") from None
          if not isinstance(result, dict) or result.get("ok") is not True:
              raise SystemExit("Telegram did not confirm delivery.")
          print("Telegram confirmed delivery.")
